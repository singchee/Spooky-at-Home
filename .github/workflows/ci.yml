name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: G1 typecheck
        run: npm run typecheck
      - name: G2 tests
        run: npm test
      - name: G3 build
        run: npm run build
